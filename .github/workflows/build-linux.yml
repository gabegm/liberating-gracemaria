name: Linux Build
on:
  pull_request:
  push:
  release:
    types: published

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            libvulkan-dev \
            libxcb1-dev \
            libx11-xcb-dev \
            libxcb-dri3-dev \
            libxcb-present-dev \
            libxcb-randr0-dev \
            libxcb-shm0-dev \
            libxcb-xfixes0-dev \
            libxcb-xkb-dev \
            libxkbcommon-x11-dev \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libx11-dev \
            libxext-dev \
            libxrender-dev

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DREXSDK_DIR=thirdparty/rexglue-sdk \
            -DREXGLUE_USE_VULKAN=ON \
            -DREXGLUE_USE_D3D12=OFF

      - name: Build
        run: |
          cmake --build build --config Release --parallel $(nproc)

      - name: Package
        run: |
          cd build
          cpack -C Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ac6recomp-linux
          path: build/*.zip
