name: Linux Build
on:
  pull_request:
  push:
  release:
    types: published

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Initialize simde submodule (nested, not in parent .gitmodules)
        run: |
          cd thirdparty/rexglue-sdk/thirdparty
          rm -rf simde
          git clone --depth 1 https://github.com/simd-everywhere/simde.git simde

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            clang-19 \
            libvulkan-dev \
            libxcb1-dev \
            libx11-xcb-dev \
            libxcb-dri3-dev \
            libxcb-present-dev \
            libxcb-randr0-dev \
            libxcb-shm0-dev \
            libxcb-xfixes0-dev \
            libxcb-xkb-dev \
            libxkbcommon-x11-dev \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libx11-dev \
            libxext-dev \
            libxrender-dev

      - name: Generate FFmpeg avconfig.h and ffversion.h
        run: |
          cat > thirdparty/rexglue-sdk/thirdparty/FFmpeg/libavutil/avconfig.h <<- 'EOF'
          #ifndef AVUTIL_AVCONFIG_H
          #define AVUTIL_AVCONFIG_H
          #define HAVE_THREADS 1
          #define HAVE_PTHREADS 1
          #define HAVE_PRAGMA_DEPRECATED 1
          #define HAVE_FAST_CLZ 1
          #define HAVE_FAST_UNALIGNED 1
          #define AV_HAVE_BIGENDIAN 0
          #endif
          EOF
          cat > thirdparty/rexglue-sdk/thirdparty/FFmpeg/libavutil/ffversion.h <<- 'EOF'
          /* Automatically generated by CI, do not manually edit! */
          #ifndef LIBAVUTIL_FFVERSION_H
          #define LIBAVUTIL_FFVERSION_H
          #define FFMPEG_VERSION "6.0"
          #endif /* LIBAVUTIL_FFVERSION_H */
          EOF

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-19 \
            -DCMAKE_CXX_COMPILER=clang++-19 \
            -DREXSDK_DIR=thirdparty/rexglue-sdk \
            -DREXGLUE_USE_VULKAN=ON \
            -DREXGLUE_USE_D3D12=OFF

      - name: Generate codegen headers
        run: |
          cmake --build build --config Release --target ac6recomp_codegen --parallel $(nproc)

      - name: Re-configure after codegen
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-19 \
            -DCMAKE_CXX_COMPILER=clang++-19 \
            -DREXSDK_DIR=thirdparty/rexglue-sdk \
            -DREXGLUE_USE_VULKAN=ON \
            -DREXGLUE_USE_D3D12=OFF

      - name: Build
        run: |
          cmake --build build --config Release --parallel $(nproc)

      - name: Package
        run: |
          cd build
          cpack -C Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ac6recomp-linux
          path: build/*.zip
